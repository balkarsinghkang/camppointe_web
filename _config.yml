# GitHub Pages Configuration
# This file is automatically generated for CampPointe website

# Site settings
title: "CampPointe Lake Texoma RV Park"
description: "Premium RV camping at Lake Texoma with full hookups, modern amenities, and direct lake access in Gordonville, Texas."
baseurl: "/camppointe_web"
url: "https://balkarsinghkang.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# GitHub Pages specific settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude files from processing
exclude:
  - website-base/
  - seo-optimization/
  - content-strategy/
  - performance/
  - wix-customizations/
  - action-plan.md
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/

# SEO settings
