name: SEO Audit on Commit

on:
  push:
    branches:
      - main
      - develop
      - 'copilot/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Setup Ruby for Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
          
      - name: Install Jekyll and dependencies
        run: |
          gem install jekyll bundler
          bundle init
          echo 'gem "jekyll"' >> Gemfile
          echo 'gem "jekyll-sitemap"' >> Gemfile
          echo 'gem "jekyll-seo-tag"' >> Gemfile
          echo 'gem "jekyll-feed"' >> Gemfile
          bundle install
          
      - name: Build Jekyll site
        run: |
          bundle exec jekyll build --baseurl ""
          
      - name: Install SEO Crawler dependencies
        run: |
          npm install
          
      - name: Run SEO Crawler
        run: |
          node scripts/seo-crawler.js _site
          
      - name: Install Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          
      - name: Create Lighthouse config
        run: |
          mkdir -p .lighthouseci
          cat > .lighthouseci/lighthouserc.json << 'EOF'
          {
            "ci": {
              "collect": {
                "staticDistDir": "./_site",
                "numberOfRuns": 1,
                "settings": {
                  "preset": "desktop",
                  "onlyCategories": ["performance", "accessibility", "best-practices", "seo"]
                }
              },
              "assert": {
                "assertions": {
                  "categories:seo": ["error", {"minScore": 0.8}],
                  "categories:accessibility": ["warn", {"minScore": 0.8}],
                  "categories:performance": ["warn", {"minScore": 0.7}],
                  "categories:best-practices": ["warn", {"minScore": 0.8}]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF
          
      - name: Run Lighthouse CI
        run: |
          lhci autorun || true
          
      - name: Add Lighthouse results to report
        run: |
          cat >> seo-report.md << 'EOF'
          
          ---
          
          ## 📊 Lighthouse Scores
          
          See Lighthouse HTML report in artifacts for detailed performance, accessibility, and SEO metrics.
          
          ---
          
          ## 🎯 Key SEO Best Practices
          
          ### Title Tags
          - Should be 50-60 characters
          - Should be unique for each page
          - Should include primary keyword
          - Should be compelling for click-through
          
          ### Meta Descriptions
          - Should be 150-160 characters
          - Should be unique for each page
          - Should include target keywords naturally
          - Should include a call-to-action
          
          ### Headings
          - One H1 per page
          - Sequential hierarchy (H1 -> H2 -> H3)
          - Include keywords naturally
          - Descriptive and meaningful
          
          ### Images
          - All images should have alt text
          - Alt text should be descriptive
          - File names should be descriptive
          - Optimize file sizes for web
          
          ### Structured Data
          - Add Schema.org markup for local business
          - Add RVPark schema type
          - Include business information
          - Add review/rating markup if applicable
          
          ### Internal Linking
          - Link to important pages from homepage
          - Use descriptive anchor text
          - Create content silos/hubs
          - Ensure all pages are accessible
          
          ### Content Quality
          - Aim for 300+ words on key pages
          - Use natural keyword integration
          - Provide valuable, unique content
          - Update content regularly
          
          ---
          
          **Next Steps:**
          1. Review and address critical issues first
          2. Optimize high-priority items
          3. Implement structured data
          4. Monitor rankings and traffic
          5. Run this audit regularly after changes
          
          EOF
          
      - name: Upload SEO Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit-report
          path: |
            seo-report.md
            .lighthouseci/**/lhr-*.html
            .lighthouseci/**/lhr-*.json
          retention-days: 30
            
      - name: Comment PR with SEO Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              // Read the SEO report
              let report = fs.readFileSync('seo-report.md', 'utf8');
              
              // Extract summary section for PR comment
              const summaryMatch = report.match(/## 📊 Summary[\s\S]*?(?=##|$)/);
              const criticalMatch = report.match(/## 🔴 Critical Issues[\s\S]*?(?=##|$)/);
              const highMatch = report.match(/## 🟠 High Priority Issues[\s\S]*?(?=##|$)/);
              
              let comment = '## 🔍 SEO Audit Results\n\n';
              
              if (summaryMatch) {
                comment += summaryMatch[0] + '\n';
              }
              
              if (criticalMatch) {
                comment += criticalMatch[0] + '\n';
              } else {
                comment += '### ✅ No Critical Issues Found\n\n';
              }
              
              if (highMatch) {
                // Limit high priority issues in comment
                const highSection = highMatch[0];
                const lines = highSection.split('\n').slice(0, 30);
                comment += lines.join('\n');
                if (highSection.split('\n').length > 30) {
                  comment += '\n\n_(High priority issues truncated. See full report in artifacts.)_\n';
                }
                comment += '\n';
              }
              
              comment += '\n---\n📥 **Download full SEO report and Lighthouse results from the workflow artifacts.**\n';
              comment += '📖 **See [SEO_CRAWLER.md](../blob/main/SEO_CRAWLER.md) for documentation.**';
              
              // Truncate if still too long (GitHub comment limit is ~65,536 characters)
              if (comment.length > 60000) {
                comment = comment.substring(0, 60000) + '\n\n... (comment truncated, see artifacts for full report)';
              }
              
              // Post comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.error('Error posting PR comment:', error);
              // Don't fail the workflow if commenting fails
            }
            
      - name: Display Summary
        if: always()
        run: |
          echo "======================================"
          echo "SEO Audit Complete!"
          echo "======================================"
          if [ -f seo-report.md ]; then
            cat seo-report.md | head -50
            echo ""
            echo "Full report available in artifacts"
          else
            echo "SEO report not generated"
          fi
          echo "======================================"
          
      - name: Check for Critical Issues
        run: |
          if grep -q "🔴 Critical: 0" seo-report.md; then
            echo "✅ No critical SEO issues found!"
            exit 0
          else
            echo "⚠️ Critical SEO issues found. Review the report."
            # Don't fail the workflow, just warn
            exit 0
          fi
